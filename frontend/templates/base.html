<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e9f6e">
  <meta name="description" content="{% block description %}Вовремя — планер, который ведёт по плану и пересчитывает время, чтобы вы закончили вовремя.{% endblock %}">
  <title>{% block title %}Вовремя{% endblock %}</title>
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/base.css?v={{ asset_version }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
</body>
</html>
