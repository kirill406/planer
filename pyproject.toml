[project]
name = "planer"
version = "0.1.0-alpha"
description = "Вовремя — планер с таймерами: ведёт по плану и пересчитывает время, чтобы закончить вовремя"
readme = "README.md"
authors = [
    { name = "Kirill Borovoy", email = "kirillmolinillo@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.scripts]
planer = "planer.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8.6",
]

[tool.ruff]
line-length = 79
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: FastAPI Depends() in defaults is the framework idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
